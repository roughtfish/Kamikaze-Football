    view.innerHTML = html;
    document.getElementById('toPicks').onclick=()=>setTab('picks');
    return;
  }
  g.results = g.results || {};
  teamsToRate.forEach(t=>{
    const r = g.results[t.name] || '';
    const pickers = Object.entries(previewPicks)
      .filter(([,p])=>p.team===t.name)
      .map(([name,p])=>{
        const flags = [p.auto?'auto':'', p.wildcard?'WC':'', p.drawcard?'DC':'', p.doubleOrNothing?'DoN':''].filter(Boolean).join(' ');
        return flags ? `${name} (${flags})` : name;
      }).join(', ');
    html += `<div class="fixrow" data-team="${t.name}">
      <span class="nm">${t.name} <span class="strength">str ${t.strength}</span>
        <span class="strength" style="display:block;margin-top:2px;">${pickers}</span></span>
      <span></span><span></span>
      <span class="seg">
        <button class="rW ${r==='W'?'on H':''}" data-r="W">Win</button>
        <button class="rD ${r==='D'?'on D':''}" data-r="D">Draw</button>
        <button class="rL ${r==='L'?'on A':''}" data-r="L">Loss</button>
      </span></div>`;
  });

  // alive managers still without a team (no pick + nothing left to auto-assign)
  const noTeam = aliveManagers().filter(m=>{ const p=previewPicks[m.name]; return !(p&&p.team); }).map(m=>m.name);
  html += `<div style="padding:12px 16px">`;
  if(noTeam.length){
    html += `<div class="warnbox">No team for ${noTeam.join(', ')} — no pick was entered and the fixture list
      couldn't auto-assign one (it's empty, or every listed away team is already used up). Add fixtures on the
      picks tab or set their pick, otherwise they're skipped this week.</div>`;
  }
  html += `</div>`;
  html += `<div class="toolbar">
      <button class="btn" id="applyGw">Apply gameweek ${n}</button>
      <span class="note" id="resCount"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="backPicks">‹ Picks</button>
    </div></div>`;

  // live preview of what applying will do
  html += renderPreview(g, previewPicks);
  view.innerHTML = html;

  view.querySelectorAll('.fixrow .seg button').forEach(b=>{
    b.onclick = ()=>{
      const team = b.closest('.fixrow').dataset.team;
      g.results[team] = b.dataset.r;
      // apply the highlight immediately, independent of render timing —
      // save() will re-render anyway, but this guarantees instant feedback
      const seg = b.closest('.seg');
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on','H','D','A'));
      b.classList.add('on', b.dataset.r==='W' ? 'H' : b.dataset.r==='D' ? 'D' : 'A');
      save();
    };
  });
  document.getElementById('applyGw').onclick = async ()=>{
    const btn = document.getElementById('applyGw');
    btn.disabled = true; const prevText = btn.textContent; btn.textContent = 'Applying…';
    try{ await applyGameweek(n); }
    finally{ btn.disabled = false; btn.textContent = prevText; }
  };
  document.getElementById('backPicks').onclick = ()=>setTab('picks');
  document.getElementById('fetchRes').onclick = async ()=>{
    const note=document.getElementById('resFetchNote'); note.textContent='Fetching…';
    try{
      const {events, unmatched, total} = await tsdbFetchRound(n);
      if(!events.length){
        note.textContent = total ? `Found ${total} fixtures but couldn't match any team names.` : 'No fixtures found for that round/season yet.';
        return;
      }
      let set=0, pending=0;
      events.forEach(e=>{
        if(!e.finished){ pending++; return; }
        if(picked.has(e.home)){ g.results[e.home] = outcomeFromScore(e.homeScore, e.awayScore); set++; }
        if(picked.has(e.away)){ g.results[e.away] = outcomeFromScore(e.awayScore, e.homeScore); set++; }
      });
      save();
      toast(`Set ${set} result${set===1?'':'s'}${pending?` · ${pending} not finished yet`:''}${unmatched?` · ${unmatched} unmatched`:''}`);
      setTab('resolve');
    }catch(e){
      note.textContent = 'Fetch failed: '+e.message;
    }
  };
  const need = teamsToRate.length, have = teamsToRate.filter(t=>g.results[t.name]).length;
  document.getElementById('resCount').textContent = `${have}/${need} results set`;
  document.getElementById('applyGw').disabled = have<need;
  document.getElementById('sharePieOpen').onclick = ()=>shareGwPicksPie(n, g);
}
function readPicksLeniently(g){ g.picks = g.picks || {}; } // picks already saved via savePicks

function effect(p, result){
  // returns {delta, outcome:'W'|'D'|'L', note}
  if(p.doubleOrNothing){
    if(result==='W') return {delta:+2, outcome:'W', note:'double or nothing hit (+2)'};
    if(result==='D') return {delta:-2, outcome:'D', note:'double or nothing miss (-2)'};
    return {delta:-4, outcome:'L', note:'double or nothing miss (-4)'};
  }
  if(p.drawcard){
    if(result==='D') return {delta:+1, outcome:'D', note:'drawcard hit (+1)'};
    return {delta:-1, outcome:result, note:'drawcard miss (-1)'};
  }
  if(result==='W') return {delta:0, outcome:'W', note:''};
  if(result==='D') return p.wildcard ? {delta:0, outcome:'D', note:'wildcard (draw saved)'}
                                     : {delta:-1, outcome:'D', note:''};
  return {delta:-2, outcome:'L', note:''};
}
function renderPreview(g, picksSource){
  const flagBadge = (label, kind)=>{
    const color = kind==='auto' ? 'var(--muted)' : kind==='wild' ? 'var(--go)' : kind==='draw' ? 'var(--warn)' : 'var(--danger)';
    const border = kind==='auto' ? 'var(--line)' : kind==='wild' ? 'var(--go-dim)' : kind==='draw' ? 'var(--warn)' : 'var(--danger)';
    return `<span style="display:inline-block;font-family:var(--disp);font-size:10px;font-weight:700;
      letter-spacing:.04em;color:${color};border:1px solid ${border};border-radius:4px;
      padding:1px 5px;margin-left:6px;vertical-align:middle;">${label}</span>`;
  };
  const rows = Object.entries(picksSource || g.picks || {}).filter(([,p])=>p.team).map(([name,p])=>{
    const m = state.managers.find(x=>x.name===name);
    const badges = (p.auto?flagBadge('AUTO','auto'):'') + (p.wildcard?flagBadge('WC','wild'):'') + (p.drawcard?flagBadge('DC','draw'):'') + (p.doubleOrNothing?flagBadge('DoN','don'):'');
    const nameCell = `${name}${badges}`;
    const res = g.results[p.team];
    if(!res) return `<tr><td>${nameCell}</td><td>${p.team}</td><td class="num">—</td><td class="num">—</td><td>${m.lives}</td></tr>`;
    const e = effect(p, res);
    const nl = m.lives + e.delta;
    const cls = e.delta>0?'go':e.delta<0?'danger':'';
    const noteHtml = e.note ? `<div style="font-size:11px;color:var(--${e.delta<0?'danger':'go'});margin-top:2px;">${e.note}</div>` : '';
    return `<tr>
      <td>${nameCell}</td>
      <td>${p.team}</td>
      <td class="num">${res}</td>
      <td class="num" style="color:var(--${cls||'muted'})">${e.delta>0?'+':''}${e.delta}${noteHtml}</td>
      <td class="num">${m.lives} → <b style="color:var(--${nl<0?'danger':nl<=2?'warn':'go'})">${nl}</b>${nl<0?' ☠':''}</td>
    </tr>`;
  }).join('');
  if(!rows) return '';
  return `<div class="panel"><div class="phead"><h2>Preview</h2><span class="hint">what “Apply” will do</span></div>
    <table class="grid"><thead><tr><th>Manager</th><th>Team</th><th class="num">Res</th><th class="num">Δ</th><th class="num">Lives</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
// applies one manager's pick+result to their lives/record/bans/cards, and
// records exactly what was applied so it can be precisely reversed later —
// this is what makes editing a single pick after the fact possible
function applyForManager(g, m, pick, result){
  const e = effect(pick, result);
  m.lives += e.delta;
  if(e.outcome==='W') m.wins++; else if(e.outcome==='D') m.draws++; else m.losses++;
  m.used[pick.team] = used(m, pick.team) + 1;
  if(pick.wildcard){ m.wildcardUsed = true; m.wildcardResult = result; }
  if(pick.drawcard){ m.drawcardUsed = true; m.drawcardResult = result; }
  if(pick.doubleOrNothing){ m.doubleOrNothingUsed = true; m.doubleOrNothingResult = result; }
  m.eliminated = m.lives <= 0;
  g.applied = g.applied || {};
  g.applied[m.name] = {team:pick.team, result, delta:e.delta, outcome:e.outcome,
    wildcard:!!pick.wildcard, drawcard:!!pick.drawcard, doubleOrNothing:!!pick.doubleOrNothing};
}
// exactly reverses whatever applyForManager last recorded for this manager
// in this gameweek — leaves everyone else, and every other gameweek, untouched
function reverseAppliedForManager(g, m){
  const applied = g.applied && g.applied[m.name];
  if(!applied) return;
  m.lives -= applied.delta;
  if(applied.outcome==='W') m.wins = Math.max(0, m.wins-1);
  else if(applied.outcome==='D') m.draws = Math.max(0, m.draws-1);
  else if(applied.outcome==='L') m.losses = Math.max(0, m.losses-1);
  if(applied.team) m.used[applied.team] = Math.max(0, used(m, applied.team) - 1);
  if(applied.wildcard){ m.wildcardUsed = false; m.wildcardResult = null; }
  if(applied.drawcard){ m.drawcardUsed = false; m.drawcardResult = null; }
  if(applied.doubleOrNothing){ m.doubleOrNothingUsed = false; m.doubleOrNothingResult = null; }
  m.eliminated = m.lives <= 0;
  delete g.applied[m.name];
}
async function applyGameweek(n){
  const g = gwObj(n, true);
  materializeAutos(g);                       // no-shows get their auto away team
  // lock in the league table as it stood entering this gameweek, once — re-resolving
  // or undoing later never overwrites it, so "picked team value" stays historically honest.
  // computed by replaying every real result up to this gameweek's matchday, so it's
  // accurate even if there's a delay between the matches being played and being
  // resolved here — if the fetch fails, fall back to whatever's already on file
  // rather than blocking the whole apply action over a network hiccup
  let matches = null;
  if(!g.tableSnapshot){
    try{
      matches = await fetchSeasonMatchesUpTo(n);
      const standings = computeStandingsFromMatches(matches, n);
      if(standings){
        g.tableSnapshot = state.teams.map(t=>{
          const s = standings.find(x=>x.name===t.name);
          return {name:t.name, strength: s ? s.position : t.strength};
        });
      }
      // standings is null when nothing's been played yet (gameweek 1) — leave
      // tableSnapshot unset entirely rather than fabricate one; picks that
      // gameweek simply won't count toward Picked Team Value, correctly
    }catch(e){
      console.warn('table auto-fetch failed, using existing strength values:', e);
      g.tableSnapshot = state.teams.map(t=>({name:t.name, strength:t.strength}));
    }
  }
  const picks = Object.entries(g.picks||{}).filter(([,p])=>p.team);
  g.applied = g.applied || {};
  picks.forEach(([name,p])=>{
    const m = state.managers.find(x=>x.name===name);
    const res = g.results[p.team]; if(!res) return;
    if(g.applied[name]) return;   // already applied — avoid double-counting on a re-run
    applyForManager(g, m, p, res);
  });
  // capture each manager's Squad Strength as it stood right after THIS gameweek's
  // picks were resolved — unlike tableSnapshot (which deliberately excludes this
  // gameweek's own result, for fair PTV judgement), this one includes it, since
  // it's answering "how's my situation now" rather than "was that pick wise"
  if(!g.squadStrengthSnapshot){
    try{
      if(!matches) matches = await fetchSeasonMatchesUpTo(n);
      const afterStandings = computeStandingsFromMatches(matches, n+1);   // "< n+1" = through this matchday
      if(afterStandings){
        g.squadStrengthSnapshot = {};
        state.managers.forEach(m=>{
          g.squadStrengthSnapshot[m.name] = state.teams.reduce((s,t)=>{
            const usedCount = (m.used && m.used[t.name]) || 0;
            if(usedCount >= state.maxPicksPerTeam) return s;   // banned by this point
            const left = state.maxPicksPerTeam - usedCount;
            const snap = afterStandings.find(x=>x.name===t.name);
            const pos = snap ? snap.position : 10.5;
            return s + (21-pos)*left;
          }, 0);
        });
        // also sync the live/global team strength to match — otherwise an open
        // gameweek's LIVE squad strength number (which reads this directly) could
        // silently drift from what this gameweek's own frozen snapshot just used,
        // even with zero new real matches played, simply because nothing else
        // keeps this in sync except the separate manual "update from live table"
        // button
        state.teams.forEach(t=>{
          const snap = afterStandings.find(x=>x.name===t.name);
          if(snap) t.strength = snap.position;
        });
        state.tableUpdatedAt = new Date().toISOString();
      }
    }catch(e){
      console.warn('squad strength snapshot failed:', e);
    }
  }
  g.status = 'resolved';
  g.locked = true;   // resolving obviously reveals picks — deliberately not undone by undoGameweek
  state.currentGw = n + 1;
  viewGw = state.currentGw;
  save();
  toast(`Gameweek ${n} applied`);
  setTab('standings');
  autoPublishStats();
}
// fire-and-forget publish, used after actions that change what players see —
// failures don't interrupt the admin action, just surface quietly via console
function autoPublishStats(){
  publishPublicStats()
    .then(()=>recordPublishResult(true))
    .catch(e=>{ console.warn('auto-publish failed:', e); recordPublishResult(false, e.message||String(e)); });
}
function undoGameweek(n){
  const g = gwObj(n);
  if(!g || !g.applied || !Object.keys(g.applied).length){ toast('Nothing to undo'); return; }
  Object.keys(g.applied).forEach(name=>{
    const m = state.managers.find(x=>x.name===name);
    if(m) reverseAppliedForManager(g, m);
  });
  g.status = 'open'; state.currentGw = n; viewGw = state.currentGw;
  save(); toast(`Gameweek ${n} reopened`); setTab('resolve');
  autoPublishStats();
}
// correct ONE manager's pick/result/cards for an already-resolved gameweek,
// without reopening the week or touching anyone else. If the team's result
// itself is being changed, every other manager who picked that same team is
// recomputed too, so the shared result stays consistent for everyone on it.
function editManagerPick(n, managerName, newTeam, newResult, newWildcard, newDrawcard, newDoN){
  const g = gwObj(n, true);
  const m = state.managers.find(x=>x.name===managerName);
  if(!m){ toast('Manager not found'); return; }
  if(!newTeam){ toast('Pick a team first'); return; }
  if(!newResult){ toast('Set a result for that team first'); return; }
  reverseAppliedForManager(g, m);
  const oldTeamResult = g.results[newTeam];
  g.results = g.results || {};
  g.results[newTeam] = newResult;
  if(oldTeamResult && oldTeamResult !== newResult){
    // the shared result for this team changed — recompute everyone else on it too
    Object.entries(g.picks||{}).forEach(([otherName, otherP])=>{
      if(otherName === managerName || !otherP || otherP.team !== newTeam) return;
      const otherM = state.managers.find(x=>x.name===otherName);
      if(!otherM) return;
      reverseAppliedForManager(g, otherM);
      applyForManager(g, otherM, otherP, newResult);
    });
  }
  g.picks = g.picks || {};
  g.picks[managerName] = {team:newTeam, wildcard:!!newWildcard, drawcard:!!newDrawcard, doubleOrNothing:!!newDoN, auto:false};
  applyForManager(g, m, g.picks[managerName], newResult);
  save();
  toast(`${managerName}'s GW${n} pick updated`);
  setTab('resolve');
  autoPublishStats();
}

// how many times each team has been picked across the whole season so far,
// including teams with zero picks — so "only picked twice all year" is visible too
// how auto-assigned picks (nobody sent one in that week) have actually performed
// against manually-entered ones, across the whole season — and whether the
// robot's win rate would beat any real manager's own overall win rate
function computeAutoPickRecord(){
  const QNAME = 'Q';
  const auto = {picks:0, wins:0, draws:0, losses:0};   // Q's own picks specifically
  const manual = {picks:0, wins:0, draws:0, losses:0}; // every other manager
  Object.values(state.gameweeks||{}).forEach(g=>{
    if(g.status!=='resolved') return;
    Object.entries(g.picks||{}).forEach(([name,p])=>{
      if(!p || !p.team) return;
      const res = g.results && g.results[p.team];
      if(!res) return;
      const bucket = (name===QNAME) ? auto : manual;
      bucket.picks++;
      if(res==='W') bucket.wins++; else if(res==='D') bucket.draws++; else bucket.losses++;
    });
  });
  const rate = b => b.picks ? b.wins/b.picks : null;
  const autoRate = rate(auto);
  const beaten = autoRate===null ? [] : state.managers.filter(m=>{
    if(m.name===QNAME) return false;   // Q can't be counted as "beaten by Q"
    const total = m.wins+m.draws+m.losses;
    return total>0 && (m.wins/total) < autoRate;
  });
  return {auto, manual, autoRate, manualRate: rate(manual), beaten: beaten.map(m=>m.name)};
}

// win rate per team when actually picked, across the whole season — the

function computeTeamPerformance(){
  const stats = {};
  Object.values(state.gameweeks||{}).forEach(g=>{
    if(g.status!=='resolved') return;
    Object.values(g.picks||{}).forEach(p=>{
      if(!p || !p.team) return;
      const res = g.results && g.results[p.team];
      if(!res) return;
      const s = stats[p.team] = stats[p.team] || {picks:0,wins:0,draws:0,losses:0};
      s.picks++;
      if(res==='W') s.wins++; else if(res==='D') s.draws++; else s.losses++;
    });
  });
  return Object.entries(stats).map(([team,s])=>({team,...s, winRate: s.picks?s.wins/s.picks:0}))
    .sort((a,b)=>b.winRate-a.winRate || b.picks-a.picks);
}

// biggest upset win + the best single gameweek life swing, across the season —
// there's no meaningful "worst" swing since -2 (a plain loss) is the common
// floor for any pick, not a rare event, so it'd just lock onto the first loss
function computeSeasonExtremes(){
  let biggestUpset = null, biggestHeartbreak = null, bestSwing = null;
  Object.keys(state.gameweeks||{}).map(Number).sort((a,b)=>a-b).forEach(n=>{
    const g = state.gameweeks[n];
    if(g.status!=='resolved' || !g.applied) return;
    Object.entries(g.applied).forEach(([name,a])=>{
      if(a.result==='W' && g.tableSnapshot){
        const snap = g.tableSnapshot.find(t=>t.name===a.team);
        const valid = snap && typeof snap.strength === 'number' && !isNaN(snap.strength);
        if(valid && (!biggestUpset || snap.strength > biggestUpset.position)){
          biggestUpset = {manager:name, team:a.team, gw:n, position:snap.strength};
        }
      }
      if(a.result==='L' && g.tableSnapshot){
        const snap = g.tableSnapshot.find(t=>t.name===a.team);
        const valid = snap && typeof snap.strength === 'number' && !isNaN(snap.strength);
        if(valid && (!biggestHeartbreak || snap.strength < biggestHeartbreak.position)){
          biggestHeartbreak = {manager:name, team:a.team, gw:n, position:snap.strength};
        }
      }
      if(!bestSwing || a.delta > bestSwing.delta) bestSwing = {manager:name, gw:n, delta:a.delta, team:a.team, result:a.result};
    });
  });
  return {biggestUpset, biggestHeartbreak, bestSwing};
}
function renderSeasonExtremesPanel(){
  const e = computeSeasonExtremes();

// how often each manager goes with the crowd vs strikes out alone, across the season
function computeContrarianCopycat(onlyResolved){
  const tally = {};
  Object.values(state.gameweeks||{}).forEach(g=>{
    if(onlyResolved && g.status!=='resolved') return;   // publish-safe mode: no leaking unlocked picks
    const picks = Object.entries(g.picks||{}).filter(([,p])=>p&&p.team);
    if(!picks.length) return;
    const counts = {};
    picks.forEach(([,p])=> counts[p.team] = (counts[p.team]||0)+1);
    const maxCount = Math.max(...Object.values(counts));
    picks.forEach(([name,p])=>{
      tally[name] = tally[name] || {contrarian:0, copycat:0, played:0};
      tally[name].played++;
      if(counts[p.team]===1) tally[name].contrarian++;
      if(counts[p.team]===maxCount && maxCount>1) tally[name].copycat++;
    });
  });
  return Object.entries(tally).map(([name,t])=>({name,...t}));
}

function computeCardTiming(){
  const timing = {};
  const blank = ()=>({wildcardGw:null, wildcardResult:null, drawcardGw:null, drawcardResult:null, donGw:null, donResult:null});
  state.managers.forEach(m=> timing[m.name] = blank());
  Object.keys(state.gameweeks||{}).map(Number).sort((a,b)=>a-b).forEach(n=>{
    const g = state.gameweeks[n];
    if(g.status!=='resolved' || !g.applied) return;
    Object.entries(g.applied).forEach(([name,a])=>{
      if(!timing[name]) timing[name] = blank();
      if(a.wildcard && timing[name].wildcardGw===null){ timing[name].wildcardGw=n; timing[name].wildcardResult=a.result; }
      if(a.drawcard && timing[name].drawcardGw===null){ timing[name].drawcardGw=n; timing[name].drawcardResult=a.result; }
      if(a.doubleOrNothing && timing[name].donGw===null){ timing[name].donGw=n; timing[name].donResult=a.result; }

  });
  return Object.entries(timing).map(([name,t])=>({name,...t})).filter(t=>t.wildcardGw!==null || t.drawcardGw!==null || t.donGw!==null);
}

  const current = {}; state.managers.forEach(m=> current[m.name] = state.startingLives||15);

  Object.keys(state.gameweeks||{}).map(Number).sort((a,b)=>a-b).forEach(n=>{

// last N resolved gameweeks' W/D/L per manager — a form guide
// each manager's CURRENT unbroken run — consecutive wins, or consecutive
// losses, up to their most recent resolved pick. A draw breaks either kind of
// streak. Gameweeks with no pick for a manager (e.g. after elimination) are
// skipped rather than breaking the streak, so it freezes at whatever it was
// rather than being wiped out by weeks they were no longer playing.
function computeStreaks(){
  const gwOrder = Object.keys(state.gameweeks||{}).map(Number).sort((a,b)=>a-b)
    .filter(n=>state.gameweeks[n].status==='resolved');
  const streaks = state.managers.map(m=>{
    let winStreak=0, lossStreak=0;
    gwOrder.forEach(n=>{
      const g = state.gameweeks[n];
      const p = g.picks && g.picks[m.name];
      const res = (p && p.team && g.results) ? g.results[p.team] : undefined;
      if(res==='W'){ winStreak++; lossStreak=0; }
      else if(res==='L'){ lossStreak++; winStreak=0; }
      else if(res==='D'){ winStreak=0; lossStreak=0; }
      // no result this week for them (no pick, or gameweek not fully resolved
      // for them) -- leave both counts untouched rather than breaking the streak
    });
    return {name:m.name, winStreak, lossStreak};
  });
  const maxWin = Math.max(0, ...streaks.map(s=>s.winStreak));
  const maxLoss = Math.max(0, ...streaks.map(s=>s.lossStreak));
  const bestWin = maxWin>=2 ? {length:maxWin, names: streaks.filter(s=>s.winStreak===maxWin).map(s=>s.name)} : null;
  const worstLoss = maxLoss>=2 ? {length:maxLoss, names: streaks.filter(s=>s.lossStreak===maxLoss).map(s=>s.name)} : null;
  return {streaks, bestWin, worstLoss};
}
// joins names naturally: "Andy" / "Andy and Sam" / "Andy, Sam, and Q"
function joinNames(names){
  if(names.length===1) return names[0];
  if(names.length===2) return names[0]+' and '+names[1];
  return names.slice(0,-1).join(', ')+', and '+names[names.length-1];
}
function renderStreaksPanel(){
  const s = computeStreaks();
  if(!s.bestWin && !s.worstLoss) return '';
  const lines = [];
  if(s.bestWin) lines.push(`<b>🔥 Hot streak:</b> ${joinNames(s.bestWin.names)} ${s.bestWin.names.length===1?'has':'have'} won ${s.bestWin.length} gameweeks in a row.`);
  if(s.worstLoss) lines.push(`<b>🥶 Cold streak:</b> ${joinNames(s.worstLoss.names)} ${s.worstLoss.names.length===1?'has':'have'} lost ${s.worstLoss.length} gameweeks in a row.`);
  return `<div class="panel"><div class="phead"><h2>Current streaks</h2></div>

    <div class="toolbar"><button class="btn ghost shareStreaks">Share streaks</button></div></div>`;
}

function computeFormGuide(n=5){
  const gwOrder = Object.keys(state.gameweeks||{}).map(Number).sort((a,b)=>a-b)
    .filter(gw=>state.gameweeks[gw].status==='resolved');
  const recent = gwOrder.slice(-n);
  return state.managers.map(m=>{
    const form = recent.map(gwn=>{
      const g = state.gameweeks[gwn];
      const p = g.picks && g.picks[m.name];
      if(!p || !p.team) return null;
      return (g.results && g.results[p.team]) || null;
    });
    const wins = form.filter(r=>r==='W').length;
    const draws = form.filter(r=>r==='D').length;
    const losses = form.filter(r=>r==='L').length;
    return {name:m.name, form, eliminated:!!m.eliminated, wins, draws, losses};
  }).filter(r=>r.form.some(x=>x!==null))
    .sort((a,b)=> b.wins-a.wins || b.draws-a.draws || a.losses-b.losses);
}
function renderFormGuidePanel(){
  const board = computeFormGuide(5);
  if(!board.length) return '';
  const chip = r => r ? `<span class="histres ${r==='W'?'go':r==='L'?'danger':'warn'}" style="margin:0 2px">${r}</span>` : '<span class="strength" style="margin:0 4px">–</span>';

      <span>${t.form.map(chip).join('')}</span>

  return `<div class="panel"><div class="phead"><h2>Form guide</h2>
      <span class="hint">Last 5 resolved gameweeks, oldest to newest</span></div>

}

// which two managers have most often had picks on opposite sides of the same match
function computeRivalries(){
  const pairTally = {};
  Object.values(state.gameweeks||{}).forEach(g=>{
    if(g.status!=='resolved') return;
    computeHeadToHeads(g).forEach(h=>{
      h.homePickers.forEach(homeName=>{
        h.awayPickers.forEach(awayName=>{
          const [a,b] = [homeName, awayName].sort();
          const key = a+'|'+b;
          pairTally[key] = pairTally[key] || {a,b,count:0, aWins:0, bWins:0, draws:0};
          pairTally[key].count++;
          const homeIsA = homeName===a;
          if(h.homeResult==='D'){ pairTally[key].draws++; }
          else if(h.homeResult==='W'){ if(homeIsA) pairTally[key].aWins++; else pairTally[key].bWins++; }
          else if(h.homeResult==='L'){ if(homeIsA) pairTally[key].bWins++; else pairTally[key].aWins++; }
        });
      });
    });
  });
  return Object.values(pairTally).sort((a,b)=>b.count-a.count);
}
function renderRivalryPanel(){
  const rivalries = computeRivalries();
  if(!rivalries.length || rivalries[0].count < 2) return '';   // one meeting isn't a "rivalry" yet

function computeTeamPopularity(onlyResolved){
  const counts = {};
  Object.values(state.gameweeks||{}).forEach(g=>{
    if(onlyResolved && g.status!=='resolved') return;   // publish-safe mode: no leaking unlocked picks
    Object.values(g.picks||{}).forEach(p=>{
      if(!p || !p.team) return;
      counts[p.team] = (counts[p.team]||0) + 1;
    });
  });
  return state.teams.map(t=>({team:t.name, count:counts[t.name]||0})).sort((a,b)=>b.count-a.count);
}

function renderHistory(){

  const cardBadge = (label, res, successResult='D') => {
    const cls = !res ? '' : (res===successResult ? 'go' : 'danger');
    return `<span class="histres ${cls}">${label}</span>`;
  };
  const rows = gws.map(n=>{

  view.querySelectorAll('[data-h2h-name]').forEach(el=>{
    el.onclick = ()=>showHeadToHeadDetail(el.dataset.h2hName);

  const m=/^(\d{2})\/(\d{2})$/.exec(String(prev||'').trim());
  if(m){ const a=(+m[1]+1)%100, b=(+m[2]+1)%100; return String(a).padStart(2,'0')+'/'+String(b).padStart(2,'0'); }
  return '26/27';
}

  seasonDraft = { label: nextLabel(base && base.season), managers: (base.managers||[]).map(m=>m.name) };
}
function seasonSummary(s){
  const mgrs=(s.managers||[]); const alive=mgrs.filter(m=>!m.eliminated).length;

function deleteSeason(id){
  if(!root || !root.seasons || !root.seasons[id]) return;
  const s = root.seasons[id];
  const label = s.season || id;
  const totalSeasons = Object.keys(root.seasons).length;
  if(totalSeasons <= 1){ alert("Can't delete your only season — start a new one first if you want to replace it."); return; }
  if(!confirm(`Delete "${label}" permanently?\n\n${seasonSummary(s)}\nThis can't be undone. Download a backup first if you want to keep a copy — open "${label}" and use the backup button on the Season tab.`)) return;
  delete root.seasons[id];
  if(fbRef){ firebase.database().ref(`${DB_PATH}/seasons/${id}`).remove().catch(()=>{}); }
  // if we just deleted the active season, fall back to whatever's left
  if(root.active === id){
    const remaining = Object.keys(root.seasons);
    root.active = remaining[0];
    activeId = root.active; state = root.seasons[activeId];
    if(fbRef){ firebase.database().ref(`${DB_PATH}/active`).set(activeId).catch(()=>{}); }
  }
  toast(`Deleted ${label}`);
  renderChooser();
}
function loadSeason(id){
  if(!root || !root.seasons || !root.seasons[id]) return;
  activeId=id; state=root.seasons[id]; root.active=id; stateLoaded=true; viewGw=null; for(const k in savedAtByGw) delete savedAtByGw[k];
  if(fbRef){ firebase.database().ref(`${DB_PATH}/active`).set(id).catch(()=>{}); }
  hideChooser(); setTab('standings'); toast(`Loaded ${state.season||id}`);
  autoPublishStats();
}
function createSeason(label, names){
  const fresh = {
    season: label, startingLives:15, maxPicksPerTeam:2, currentGw:1,
    teams: PL_2627.map(t=>({...t})),
    managers: names.map(name=>({name, lives:15, wins:0, draws:0, losses:0,
      eliminated:false, wildcardUsed:false, drawcardUsed:false, doubleOrNothingUsed:false, used:{}, picks:{}})),
    gameweeks:{}
  };
  const id = uniqueId(label);
  root = root || {seasons:{}}; root.seasons = root.seasons || {};
  root.seasons[id]=fresh; root.active=id; activeId=id; state=fresh; stateLoaded=true; viewGw=null; for(const k in savedAtByGw) delete savedAtByGw[k];
  if(fbRef){
    firebase.database().ref(`${DB_PATH}/seasons/${id}`).set(fresh).catch(e=>console.warn(e));
    firebase.database().ref(`${DB_PATH}/active`).set(id).catch(()=>{});
    // starting a season is the one deliberate action that should make it the
    // one players see — loading/viewing an old season never does this
    firebase.database().ref(`${PUBLIC_PATH}/activeSeasonId`).set(id).catch(()=>{});
  }
  hideChooser(); setTab('standings'); toast(`${label} season started`);
  autoPublishStats();
}

    ];
    (function load(i){
      if(i>=urls.length){ initStore(); return; }
      const s=document.createElement('script'); s.src=urls[i];
      s.onload=()=>load(i+1); s.onerror=()=>load(i+1);
      document.head.appendChild(s);
    })(0);
  } else {
    initStore();
  }
})();
</script>
</body>
</html>
