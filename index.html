<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamikaze Football · PL Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080d18; --panel:#101a2c; --panel-2:#16223a; --raised:#1d2c49;
    --line:#283a5c; --line-soft:#1c2a44;
    --ink:#eaf1fb; --muted:#8ea0c0; --faint:#5e7095;
    --go:#19e2a0;        /* alive / win */
    --go-dim:#0e7d5c;
    --warn:#ffc043;      /* low lives */
    --danger:#ff5b7e;    /* loss / out */
    --pitch:#2a3d5e;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 30px -18px rgba(0,0,0,.8);
    --disp:'Barlow Condensed', system-ui, sans-serif;
    --body:'Barlow', system-ui, -apple-system, sans-serif;
    --num:ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 500px at 50% -200px, rgba(25,226,160,.07), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45;
    -webkit-font-smoothing:antialiased; padding-bottom:64px;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:0 16px}

  /* ---- Masthead ---- */
  header.top{
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg, rgba(16,26,44,.9), rgba(8,13,24,.4));
    position:sticky; top:0; z-index:30; backdrop-filter:blur(8px);
  }
  .mast{display:flex; align-items:center; gap:14px; padding:12px 0}
  .crest{width:38px;height:38px;flex:0 0 auto;filter:drop-shadow(0 0 6px rgba(148,163,184,.35))}
  .crest-wind path{animation:crestDrift 2.4s ease-in-out infinite}
  .crest-wind path:nth-child(2){animation-delay:.15s}
  .crest-wind path:nth-child(3){animation-delay:.3s}
  @keyframes crestDrift{
    0%,100%{transform:translateX(0);opacity:.5}
    50%{transform:translateX(3px);opacity:.85}
  }
  .title h1{
    font-family:var(--disp); font-weight:700; letter-spacing:.04em;
    margin:0; font-size:23px; line-height:1; text-transform:uppercase;
  }
  .title h1 .k{color:var(--go)}
  .title .sub{font-size:12px; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin-top:3px}
  .mast .spacer{flex:1}
  .chip{
    font-family:var(--disp); text-transform:uppercase; letter-spacing:.06em;
    font-size:12px; padding:5px 10px; border-radius:999px; border:1px solid var(--line);
    color:var(--muted); display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .chip.live .dot{background:var(--go); box-shadow:0 0 8px var(--go)}
  .chip.local .dot{background:var(--warn)}

  /* ---- GW bar ---- */
  .gwbar{display:flex; align-items:center; gap:10px; padding:12px 0 4px}
  .gwbar .lab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-size:12px}
  .gwstep{
    display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);
    border-radius:10px;overflow:hidden;background:var(--panel)
  }
  .gwstep button{
    background:none;border:0;color:var(--ink);font-family:var(--num);font-size:15px;
    padding:6px 12px;cursor:pointer
  }
  .gwstep button:hover{background:var(--raised)}
  .gwstep .gwnum{font-family:var(--disp);font-weight:700;font-size:20px;min-width:46px;text-align:center;padding:2px 6px}
  .gwstate{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--disp)}
  .gwstate b{color:var(--go)}

  /* ---- Tabs ---- */
  nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft);margin-top:10px;overflow-x:auto}
  nav.tabs button{
    background:none;border:0;color:var(--muted);font-family:var(--disp);
    text-transform:uppercase;letter-spacing:.06em;font-size:15px;font-weight:600;
    padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap
  }
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--go)}

  main{padding-top:18px}
  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow)}
  .panel + .panel{margin-top:16px}
  .phead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
  .phead h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:16px;margin:0}
  .phead .hint{font-size:12.5px;color:var(--muted);margin-left:auto}

  /* ---- Standings ---- */
  .board{padding:6px 8px 12px}
  .row{
    display:grid;grid-template-columns:30px 1fr 150px 92px 70px;align-items:center;
    gap:10px;padding:9px 10px;border-radius:10px
  }
  .row.head{color:var(--faint);font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;padding-bottom:4px}
  .row.mgr:hover{background:var(--panel-2)}
  .row.mgr + .row.mgr{border-top:1px solid var(--line-soft)}
  .rank{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--faint);text-align:center}
  .rank.lead{color:var(--go)}
  .who{display:flex;align-items:center;gap:9px;min-width:0}
  .who .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cards{display:flex;gap:4px}
  .cardpip{
    font-family:var(--disp);font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;padding:0 3px;cursor:default;border:1px solid var(--line);color:var(--faint);user-select:none
  }
  .cardpip.avail{border-color:var(--go-dim);color:var(--go);background:rgba(25,226,160,.08)}
  .cardpip.used{opacity:.45;text-decoration:line-through}
  .cardpip.success{border-color:var(--go-dim);color:var(--go);background:rgba(25,226,160,.12);opacity:1}
  .cardpip.fail{border-color:var(--danger);color:var(--danger);background:rgba(255,91,126,.14);opacity:1;font-weight:800}
  .cardpip:hover{border-color:var(--ink)}
  .lives{display:flex;align-items:center;gap:8px}
  .pips{display:flex;gap:2px;flex-wrap:nowrap}
  .pip{width:6px;height:16px;border-radius:2px;background:var(--line)}
  .pip.on{background:var(--go)}
  .pip.warn{background:var(--warn)}
  .pip.danger{background:var(--danger)}
  .lifenum{font-family:var(--num);font-size:17px;min-width:26px;text-align:right;font-weight:600}
  .cardnet{font-family:var(--num);font-size:11px;font-weight:700;border-radius:4px;padding:1px 4px;margin-left:2px}
  .cardnet.up{color:var(--go);background:rgba(25,226,160,.1)}
  .cardnet.down{color:var(--danger);background:rgba(255,91,126,.1)}
  .cardnet.flat{color:var(--muted);background:var(--panel-2)}
  .lifenum.warn{color:var(--warn)} .lifenum.danger{color:var(--danger)} .lifenum.go{color:var(--go)}
  .wdl{font-family:var(--num);font-size:13px;color:var(--muted);letter-spacing:.02em;text-align:center}
  .wdl b{color:var(--ink)}
  .bans{font-family:var(--num);font-size:13px;color:var(--faint);text-align:center}
  .row.out{opacity:.5}
  .row.out .nm{text-decoration:line-through}
  .outtag{font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--danger);
    border:1px solid var(--danger);border-radius:4px;padding:1px 5px;text-transform:uppercase}
  .shareMgr{background:none;border:1px solid var(--line);color:var(--faint);border-radius:5px;
    width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1;flex-shrink:0}
  .shareMgr:hover{border-color:var(--go-dim);color:var(--go)}
  .sep{display:flex;align-items:center;gap:10px;color:var(--faint);font-family:var(--disp);
    text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding:14px 12px 6px}
  .sep::after{content:"";flex:1;height:1px;background:var(--line-soft)}

  /* ---- generic ---- */
  table.grid{width:100%;border-collapse:collapse}
  table.grid th,table.grid td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-soft);font-size:14px}
  table.grid th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-size:12px;font-weight:600}
  table.grid td.num,table.grid th.num{text-align:center;font-family:var(--num)}
  select,input[type=text]{
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:7px 9px;font-family:var(--body);font-size:14px;width:100%
  }
  select:focus,input:focus{outline:2px solid var(--go-dim);outline-offset:0}
  select:disabled{opacity:.5}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--panel-2);border:0;color:var(--muted);font-family:var(--disp);font-weight:600;
    font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding:6px 11px;cursor:pointer}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{color:var(--bg)}
  .seg button.on.H{background:var(--go)} .seg button.on.D{background:var(--warn)} .seg button.on.A{background:var(--danger)}
  .ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .ck input{accent-color:var(--go)}
  .btn{
    font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-weight:600;font-size:14px;
    background:var(--go);color:#04130d;border:0;border-radius:9px;padding:10px 18px;cursor:pointer
  }
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--ink);background:var(--panel-2)}
  .btn.warn{background:var(--warn);color:#1a1300}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:13px 16px;border-top:1px solid var(--line-soft)}
  .toolbar .spacer{flex:1}
  .note{font-size:12.5px;color:var(--muted)}
  .empty{padding:34px 16px;text-align:center;color:var(--muted)}
  .empty .big{font-family:var(--disp);font-size:18px;color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
  .pickrow{display:grid;grid-template-columns:1fr 1.6fr auto;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line-soft)}
  .editrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .editrow .nm{min-width:120px;font-weight:600}
  .editrow select{width:auto;min-width:140px}
  .editrow .edSeg button{padding:6px 10px;font-size:12px}
  .pickrow .nm{font-weight:600}
  .pickrow .opts{display:flex;gap:12px;align-items:center}
  .warnbox{margin:0;padding:11px 16px;background:rgba(255,91,126,.08);border:1px solid rgba(255,91,126,.3);
    border-radius:10px;color:#ffc2cf;font-size:13.5px}
  .okbox{margin:0;padding:11px 16px;background:rgba(25,226,160,.08);border:1px solid rgba(25,226,160,.3);
    border-radius:10px;color:#bdf6e3;font-size:13.5px}
  .champpanel{border-color:rgba(255,192,67,.4);background:linear-gradient(180deg, rgba(255,192,67,.06), var(--panel));}
  .fixrow{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line-soft)}
  .fixrow .v{color:var(--faint);font-family:var(--disp);text-align:center}
  .strength{font-family:var(--num);font-size:11px;color:var(--faint)}
  .banlist{font-size:13px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raised);
    border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);
    font-size:14px;z-index:60;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .srow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .trow{display:grid;grid-template-columns:1fr 84px auto;gap:8px;align-items:center}
  /* login overlay */
  .login{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(900px 400px at 50% -120px, rgba(25,226,160,.10), transparent 60%), rgba(4,7,14,.92);
    backdrop-filter:blur(4px)}
  .login-card{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .login-crest{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .login-title{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:18px;line-height:1}
  .login-sub{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
  .login-lab{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;
    font-size:11.5px;color:var(--faint);margin:12px 0 5px}
  .login-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
  .season-item{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;cursor:pointer;color:var(--ink)}
  .season-item:hover{border-color:var(--go-dim);background:var(--raised)}
  .si-name{display:block;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.02em}
  .si-cur{font-family:var(--body);font-size:10px;color:var(--go);border:1px solid var(--go-dim);border-radius:4px;
    padding:1px 5px;margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.08em}
  .si-sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .season-row{display:flex;gap:8px;align-items:stretch}
  .season-row .season-item{flex:1}
  .rulesbody{padding:6px 18px 18px;max-width:640px}
  .rulesbody h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:16px;
    margin:22px 0 6px;color:var(--ink)}
  .rulesbody h3:first-child{margin-top:6px}
  .rulesbody p{margin:6px 0;color:var(--muted);font-size:14.5px;line-height:1.55}
  .rulesbody b{color:var(--ink)}
  .rulestag{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--go);border:1px solid var(--go-dim);border-radius:5px;padding:1px 7px;margin-left:8px;vertical-align:middle}
  .rulestable{margin:8px 0;width:auto;max-width:360px}
  .rulestable td{border-bottom:1px solid var(--line-soft);padding:7px 16px 7px 0;font-size:14px}
  .rulestable td.num{font-family:var(--num);text-align:right;padding-right:0;color:var(--ink)}
  .ruleslist{margin:8px 0 4px;padding-left:22px;color:var(--muted);font-size:14.5px;line-height:1.6}
  .ruleslist li{margin-bottom:6px}
  .ruleslist b{color:var(--ink)}
  .histtable{white-space:nowrap}
  .histtable th{position:sticky;top:0;background:var(--panel);z-index:1}
  .histtable td.num{position:sticky;left:0;background:var(--panel);z-index:1}
  .histcell{min-width:96px}
  .histteam{font-weight:500}
  .histres{display:inline-block;font-family:var(--disp);font-size:10px;font-weight:700;
    border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:middle}
  .histres.go{color:var(--go);border:1px solid var(--go-dim)}
  .histres.warn{color:var(--warn);border:1px solid var(--warn)}
  .histres.danger{color:var(--danger);border:1px solid var(--danger)}
  .fxbox{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;margin-bottom:16px;overflow:hidden}
  .fxbox>summary{padding:13px 16px;cursor:pointer;font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:14px;list-style:none}
  .fxbox>summary::-webkit-details-marker{display:none}
  .fxbox>summary .note{text-transform:none;letter-spacing:0}
  .fxpair{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center}
  .fxpair .v{color:var(--faint);font-family:var(--disp);text-align:center}
  .h2hrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .h2hside{flex:1;display:flex;flex-direction:column;gap:2px}
  .h2hside.right{align-items:flex-end;text-align:right}
  .h2hside b{font-size:15px}
  .h2hvs{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--faint);flex-shrink:0}
  @media (max-width:680px){
    .row{grid-template-columns:24px 1fr 64px;gap:8px}
    .row .lives .pips{display:none}
    .row .wdl,.row .bans,.row.head .h-wdl,.row.head .h-bans{display:none}
    .pickrow{grid-template-columns:1fr;gap:7px}
    .fixrow{grid-template-columns:1fr auto 1fr;}
    .fixrow .seg{grid-column:1/-1}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap mast">
    <svg class="crest" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <g class="crest-wind">
        <path d="M4 24 C14 20, 22 21, 30 23" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
        <path d="M2 33 C15 30, 25 31, 33 33" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75"/>
        <path d="M6 42 C17 40, 25 39, 31 38" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5"/>
      </g>
      <g transform="translate(42,32)">
        <circle r="15" fill="#f8fafc" stroke="#0b1626" stroke-width="2"/>
        <polygon points="0,-6.5 6,-2 4,5 -4,5 -6,-2" fill="#0b1626"/>
        <line x1="0" y1="-6.5" x2="0" y2="-13" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="6" y1="-2" x2="13" y2="-4.5" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="4" y1="5" x2="8" y2="12" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="-4" y1="5" x2="-8" y2="12" stroke="#0b1626" stroke-width="1.8"/>
        <line x1="-6" y1="-2" x2="-13" y2="-4.5" stroke="#0b1626" stroke-width="1.8"/>
      </g>
    </svg>
    <div class="title">
      <h1><span class="k">Kamikaze</span> Football</h1>
      <div class="sub">Premier League · Survival</div>
    </div>
    <div class="spacer"></div>
    <span id="dataChip" class="chip local"><span class="dot"></span><span id="dataChipText">Local data</span></span>
    <a href="stats.html" target="_blank" class="chip" style="text-decoration:none">↗ Player stats</a>
    <button id="signOut" class="btn ghost" style="display:none;padding:6px 12px;font-size:13px" onclick="signOutNow()">Sign out</button>
  </div>
</header>

<div class="wrap">
  <div class="gwbar">
    <span class="lab">Gameweek</span>
    <div class="gwstep">
      <button id="gwDown" title="Previous">‹</button>
      <span class="gwnum" id="gwNum">30</span>
      <button id="gwUp" title="Next">›</button>
    </div>
    <span class="gwstate" id="gwState"></span>
    <span class="chip" id="notCurrentChip" style="display:none;cursor:pointer" title="Click to jump back to the current gameweek"></span>
    <div class="spacer" style="flex:1"></div>
    <span class="chip" id="aliveChip"><span class="dot" style="background:var(--go)"></span><span id="aliveCount">—</span> alive</span>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="standings" class="on">Standings</button>
    <button data-tab="picks">Enter picks</button>
    <button data-tab="resolve">Resolve</button>
    <button data-tab="limits">Pick limits</button>
    <button data-tab="season">Season</button>
    <button data-tab="history">History</button>
    <button data-tab="rules">Rules</button>
  </nav>
</div>

<div class="login" id="login" style="display:none">
  <div class="login-card">
    <div class="login-crest">
      <svg viewBox="0 0 64 64" fill="none" width="34" height="34" aria-hidden="true">
        <g class="crest-wind">
          <path d="M4 24 C14 20, 22 21, 30 23" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
          <path d="M2 33 C15 30, 25 31, 33 33" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75"/>

function uniqueId(base){ let id=slug(base), n=2; while(root&&root.seasons&&root.seasons[id]){ id=slug(base)+'-'+(n++); } return id; }

function firebaseConsoleUrl(){
  try{
    const host = new URL(firebaseConfig.databaseURL).hostname;   // e.g. kamikaze-football-default-rtdb.europe-west1.firebasedatabase.app
    const dbInstance = host.split('.')[0];                        // e.g. kamikaze-football-default-rtdb

// coerce whatever's in storage into the {active, seasons} shape
function migrate(data){
  if(!data){ const id=slug(SEED.season); return {active:id, seasons:{[id]:structuredClone(SEED)}, _migrated:true}; }
  if(data.seasons) return data;                      // already multi-season
  const id = slug(data.season||'season');            // old flat single season -> wrap it
  return {active:id, seasons:{[id]:data}, _migrated:true};
}

async function initStore(){
  const configured = firebaseConfig.databaseURL && firebaseConfig.apiKey;
  if(!configured || typeof firebase === 'undefined'){
    root = migrate(null); activeId = root.active; state = root.seasons[activeId];
    dataLive(false, configured ? 'Firebase unreachable · local' : 'Local data (no sync)');
    stateLoaded = true; viewGw = null; for(const k in savedAtByGw) delete savedAtByGw[k];
    render(); return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    firebase.auth().onAuthStateChanged(user=>{
      if(user){ hideLogin(); showSignOut(true); connectDb(); }
      else { showSignOut(false); dataLive(false, 'Sign in to sync'); hideChooser(); showLogin(); }
    });
  }catch(e){
    console.warn('Firebase init failed, staying local:', e);
    root = migrate(null); activeId = root.active; state = root.seasons[activeId];
    dataLive(false, 'Firebase error · local');
    stateLoaded = true; viewGw = null; for(const k in savedAtByGw) delete savedAtByGw[k];

async function connectDb(){
  if(dbConnected) return; dbConnected=true;

    fbRef = firebase.database().ref(DB_PATH);

    if(data._migrated){ delete data._migrated; await fbRef.set(data); }   // persist new shape
    root = data;
    fbRef.on('value', s => {
      if(!s.exists()) return;
      root = s.val();
      if(activeId && root.seasons && root.seasons[activeId]){
        state = root.seasons[activeId];
        if(!chooserOpen()) render();
      }
    });
    dataLive(true, 'Firebase · synced');
    // preload whatever was active last, so data's ready the instant a choice is
    // made — but always show the chooser so login is where you pick the game
    if(root.active && root.seasons && root.seasons[root.active]){
      activeId = root.active; state = root.seasons[root.active]; stateLoaded = true; viewGw = null; for(const k in savedAtByGw) delete savedAtByGw[k];
    }
    showChooser('list');
  }catch(e){
    console.warn('DB connect failed:', e);
    dbConnected=false;
    dataLive(false, 'No DB access · check rules');

}
function showLogin(){ const el=document.getElementById('login'); if(el) el.style.display='flex'; }
function hideLogin(){ const el=document.getElementById('login'); if(el) el.style.display='none'; }

  const email=document.getElementById('liEmail').value.trim();
  const pw=document.getElementById('liPw').value;
  const err=document.getElementById('liErr'); err.textContent='';

    await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

      (e.code==='auth/wrong-password'||e.code==='auth/invalid-credential') ? 'Wrong email or password.' :

      e.code==='auth/invalid-email' ? 'That doesn\u2019t look like an email address.' :
      e.code==='auth/network-request-failed' ? 'Network error \u2014 check your connection.' :
      (e.message || 'Sign-in failed.');

}
function signOutNow(){ if(typeof firebase!=='undefined' && firebase.auth){ dbConnected=false; firebase.auth().signOut(); } }
let stateLoaded = false;   // true only once this session has loaded real season data — blocks saves before then
function save(){
  if(!stateLoaded){
    console.warn('save() blocked — no season loaded into this session yet, refusing to write stale/placeholder data');
    return false;
  }
  if(activeId && root && root.seasons){ root.seasons[activeId] = state; }
  if(fbRef && activeId){
    firebase.database().ref(`${DB_PATH}/seasons/${activeId}`).set(state).catch(e=>console.warn('save failed', e));
  }
  render();
  return true;
}
function normaliseUsed(){ state.managers.forEach(m=>{ m.used = m.used||{}; m.picks = m.picks||{}; }); }

/* ---------- 3. RULES HELPERS -------------------------------------------- */
const teamByName = n => state.teams.find(t=>t.name===n);
const aliveManagers = () => state.managers.filter(m=>!m.eliminated);
// returns the winning manager once only one is left standing, or null otherwise —
// guards against a trivial "win" in a season with only one manager total
function getWinner(){
  if(state.managers.length <= 1) return null;
  const alive = aliveManagers();
  return alive.length === 1 ? alive[0] : null;
}
// severity band for a life total, scaled to how many lives the season starts
// with (rather than a fixed number) — e.g. at 15 starting lives, "warn" kicks
// in once you're at or below half (8), not a flat 5 regardless of season length
function lifeSeverity(L){
  const total = state.startingLives || 15;
  const warnAt = Math.ceil(total/2);
  if(L<=2) return 'danger';
  if(L<=warnAt) return 'warn';
  return 'go';
}
function used(m,t){ return (m.used && m.used[t]) || 0; }
function isBanned(m,t){ return used(m,t) >= state.maxPicksPerTeam; }
function availableTeams(m){ return state.teams.filter(t=>!isBanned(m,t.name)); }
// each remaining pick on a team adds its position value — so a team you can
// still use twice counts twice, once if you've got one shot left on it
function remainingStrengthSum(m){
  // same scale as Picked Team Value: 21 minus league position, so Arsenal (pos 1) = 20.
  // each remaining pick on a team adds its value — so a team you can still use twice
  // counts twice. Higher total = stronger squad still in reserve.
  // a team with no valid strength yet (e.g. never appeared in a fetched fixture)
  // falls back to the league average (10.5) rather than corrupting the whole sum
  // with NaN — every manager draws from the same shared pool, so this stays fair
  // across all of them rather than favouring whoever hasn't used that team yet
  return state.teams.filter(t=>!isBanned(m,t.name)).reduce((s,t)=>{
    const left = state.maxPicksPerTeam - used(m,t.name);   // >=1, since banned teams are filtered out
    const validStrength = (typeof t.strength === 'number' && !isNaN(t.strength)) ? t.strength : 10.5;
    return s + (21 - validStrength)*left;
  },0);
}
// auto-pick: first away team (in fixture order) the manager hasn't used twice
function awayTeams(g){ return ((g&&g.fixtures)||[]).map(f=>f&&f.away).filter(Boolean); }
function autoPickTeam(m,g){
  for(const away of awayTeams(g)){ if(used(m,away) < state.maxPicksPerTeam) return away; }
  return null;
}
// fill in a team for every alive manager with no selection
// pure preview of what materializeAutos WOULD assign, without writing anything
// back — Resolve needs to see who'll be auto-assigned (to show their team's
// result row), but merely viewing the screen should never silently mark
// someone as "entered" on Enter Picks. Only applyGameweek's own
// materializeAutos call actually commits auto-assignments for real.
function previewMaterializedPicks(g){
  const preview = {...(g.picks||{})};
  aliveManagers().forEach(m=>{
    const p = preview[m.name];
    if(p && p.team) return;
    const auto = autoPickTeam(m,g);
    if(auto) preview[m.name] = {team:auto, auto:true, wildcard:(p&&p.wildcard)||false, drawcard:(p&&p.drawcard)||false, doubleOrNothing:(p&&p.doubleOrNothing)||false};
  });
  return preview;
}
function materializeAutos(g){
  g.picks = g.picks || {};
  aliveManagers().forEach(m=>{
    const p = g.picks[m.name];
    if(p && p.team) return;                       // real pick already in
    const auto = autoPickTeam(m,g);
    if(auto) g.picks[m.name] = {team:auto, auto:true, wildcard:(p&&p.wildcard)||false, drawcard:(p&&p.drawcard)||false, doubleOrNothing:(p&&p.doubleOrNothing)||false};
  });
}
let viewGw = null;   // which gameweek you're currently looking at — may differ from state.currentGw
// tracks the last publish attempt across both auto-publish and the manual
// button, so a small always-visible indicator can show if it's ever silently
// failed, rather than only logging quietly to the console
let lastPublishAt = null;      // Date of the last attempt (success or fail)
let lastPublishOk = null;      // true / false / null (null = never attempted this session)
let lastPublishErrMsg = null;
function recordPublishResult(ok, errMsg){
  lastPublishAt = new Date();
  lastPublishOk = ok;
  lastPublishErrMsg = ok ? null : (errMsg || 'Unknown error');
  updatePublishIndicator();
}
function publishIndicatorHtml(){
  if(!lastPublishAt) return '<span class="note">Not published yet this session</span>';
  const mins = Math.max(0, Math.round((Date.now()-lastPublishAt.getTime())/60000));
  const when = mins<1 ? 'just now' : mins===1 ? '1 min ago' : `${mins} min ago`;
  if(lastPublishOk===false){
    return `<span class="note" style="color:var(--danger)">⚠ Publish failed ${when} — ${lastPublishErrMsg}. Try Publish again.</span>`;
  }
  return `<span class="note" style="color:var(--go)">✓ Published ${when}</span>`;
}
function updatePublishIndicator(){
  const el = document.getElementById('publishStatusIndicator');

// managers whose picked teams are playing each other this gameweek — a real
// head-to-head, not just "picked the same team". Only returns fixtures where
// at least one manager is on each side.
function computeHeadToHeads(g, picksSource){
  const pickersByTeam = {};
  Object.entries(picksSource || g.picks || {}).forEach(([name,p])=>{
    if(!p || !p.team) return;
    (pickersByTeam[p.team] = pickersByTeam[p.team] || []).push(name);
  });
  return (g.fixtures||[]).map(f=>({
    home: f.home, away: f.away,
    homePickers: pickersByTeam[f.home] || [],
    awayPickers: pickersByTeam[f.away] || [],
    homeResult: (g.results && g.results[f.home]) || null,
    awayResult: (g.results && g.results[f.away]) || null
  })).filter(h => h.homePickers.length && h.awayPickers.length);
}
// tallies every resolved head-to-head across the whole season into a per-manager
// W/D/L record — each side's own known result decides their own outcome, so this
// is exact even when a manager's pick was on the away side of the fixture
function computeHeadToHeadLeaderboard(){
  const vs = {};   // name -> { opponentName -> {wins,draws,losses} } — the one source of truth
  Object.values(state.gameweeks||{}).forEach(g=>{
    if(g.status!=='resolved') return;
    computeHeadToHeads(g).forEach(h=>{
      h.homePickers.forEach(homeName=>{
        vs[homeName] = vs[homeName] || {};
        h.awayPickers.forEach(awayName=>{
          vs[homeName][awayName] = vs[homeName][awayName] || {wins:0,draws:0,losses:0};
          if(h.homeResult==='W') vs[homeName][awayName].wins++;
          else if(h.homeResult==='D') vs[homeName][awayName].draws++;
          else if(h.homeResult==='L') vs[homeName][awayName].losses++;
        });
      });
      h.awayPickers.forEach(awayName=>{
        vs[awayName] = vs[awayName] || {};
        h.homePickers.forEach(homeName=>{
          vs[awayName][homeName] = vs[awayName][homeName] || {wins:0,draws:0,losses:0};
          if(h.awayResult==='W') vs[awayName][homeName].wins++;
          else if(h.awayResult==='D') vs[awayName][homeName].draws++;
          else if(h.awayResult==='L') vs[awayName][homeName].losses++;
        });
      });
    });
  });
  return Object.entries(vs).map(([name,byOpp])=>{
    const opponents = Object.entries(byOpp).map(([opponent,r])=>({opponent, ...r}))
      .sort((a,b)=>(b.wins+b.draws+b.losses)-(a.wins+a.draws+a.losses));
    // the summary line is just the sum of the breakdown below it — the two can
    // never disagree, unlike a separately-tracked "per real match" tally would
    const wins = opponents.reduce((s,o)=>s+o.wins,0);
    const draws = opponents.reduce((s,o)=>s+o.draws,0);
    const losses = opponents.reduce((s,o)=>s+o.losses,0);
    return {name, wins, draws, losses, played: wins+draws+losses, opponents};
  }).filter(t=>t.played>0)
    .sort((a,b)=>{
      const ptsA = a.wins*3 + a.draws, ptsB = b.wins*3 + b.draws;
      if(ptsB !== ptsA) return ptsB - ptsA;
      if(a.losses !== b.losses) return a.losses - b.losses;   // fewer losses ranks higher when points are tied
      return b.played - a.played;   // final tiebreak: more proven over a larger sample
    });
}

function sortedStandings(){
  return [...state.managers].sort((a,b)=>{
    if(a.eliminated !== b.eliminated) return a.eliminated?1:-1;
    if(b.lives !== a.lives) return b.lives - a.lives;          // most lives
    if(a.losses !== b.losses) return a.losses - b.losses;       // fewest losses
    return remainingStrengthSum(b) - remainingStrengthSum(a);   // strongest remaining squad wins (highest value)
  });

// "Picked team value": for each resolved gameweek, score that week's pick by how
// strong the picked team was on the table *at the time* (using the locked-in
// tableSnapshot, not the current table) — 21 minus league position, so 1st = 20
// points, 20th = 1 point. Summed across the season. {total, count} — count is how
// many qualifying gameweeks went into it, so the stats page can hide it until
// someone's actually got a result on the board.
function pickedTeamValue(name){
  let total=0, count=0;
  Object.values(state.gameweeks||{}).forEach(g=>{
    if(g.status!=='resolved' || !g.tableSnapshot) return;
    const p = g.picks && g.picks[name];
    if(!p || !p.team) return;
    if(!g.results || !g.results[p.team]) return;
    const snap = g.tableSnapshot.find(t=>t.name===p.team);
    if(!snap || typeof snap.strength !== 'number' || isNaN(snap.strength)) return;   // no valid data — exclude this pick rather than fabricate a score
    total += 21 - snap.strength;
    count++;
  });
  return {total, count};
}

// what a normal (no card) pick would have yielded for a given result
function baselineDelta(result){
  if(result==='W') return 0;
  if(result==='D') return -1;
  return -2;   // 'L'
}
// "Card net": for every resolved gameweek where this manager played a card,
// the actual life change minus what a normal pick would have yielded for that
// same result — i.e. what the card actually earned or cost them, not just the
// raw outcome. Summed across the season. {net, count} — count is how many
// card plays are resolved so far, so a manager with none can be hidden.
function computeCardNet(name){
  let net=0, count=0;
  Object.values(state.gameweeks||{}).forEach(g=>{
    if(g.status!=='resolved' || !g.applied) return;
    const a = g.applied[name];
    if(!a || !a.result) return;
    if(a.wildcard || a.drawcard || a.doubleOrNothing){
      net += a.delta - baselineDelta(a.result);
      count++;
    }
  });
  return {net, count};
}

async function publishPublicStats(){
  if(!fbRef) throw new Error("Not connected to Firebase — can't publish without it");
  const rows = sortedStandings().map((m,i)=>{
    const ptv = pickedTeamValue(m.name);
    const cn = computeCardNet(m.name);
    return {
      name: m.name,
      lives: m.lives,
      eliminated: !!m.eliminated,
      wins: m.wins, draws: m.draws, losses: m.losses,
      wildcardUsed: !!m.wildcardUsed, wildcardResult: m.wildcardResult || null,
      drawcardUsed: !!m.drawcardUsed, drawcardResult: m.drawcardResult || null,
      doubleOrNothingUsed: !!m.doubleOrNothingUsed, doubleOrNothingResult: m.doubleOrNothingResult || null,
      bannedCount: state.teams.filter(t=>isBanned(m,t.name)).length,
      pickedTeamValue: ptv.total, pickedTeamValueCount: ptv.count,
      cardNet: cn.net, cardNetCount: cn.count

  });
  const managerOrder = rows.map(r=>r.name);
  const history = Object.keys(state.gameweeks||{}).map(Number).sort((a,b)=>a-b)
    .filter(n=>state.gameweeks[n].picks && Object.keys(state.gameweeks[n].picks).length)
    .map(n=>{
      const g = state.gameweeks[n];
      const resolved = g.status==='resolved';
      const locked = !!g.locked || resolved;   // resolving always implies locked
      if(!locked){
        // picks exist but haven't been locked yet — publish the row so players
        // know this gameweek's in progress, without revealing anyone's team
        return {gw:n, resolved:false, locked:false, picks:{}};
      }
      const picks = {};
      Object.entries(g.picks||{}).forEach(([name,p])=>{
        if(!p || !p.team) return;
        picks[name] = {
          team: p.team, auto: !!p.auto, wildcard: !!p.wildcard, drawcard: !!p.drawcard, doubleOrNothing: !!p.doubleOrNothing,
          result: (resolved && g.results) ? (g.results[p.team] || null) : null
        };
      });
      return {gw:n, resolved, locked:true, picks};
    });
  const winner = getWinner();
  const snapshot = {
    season: state.season || '',
    gw: gw(),
    aliveCount: aliveManagers().length,
    totalCount: state.managers.length,
    startingLives: state.startingLives || 15,
    maxPicksPerTeam: state.maxPicksPerTeam || 2,
    teamsCount: state.teams.length,
    teamCrests: state.teamCrests || {},

    managers: rows,

    teamPopularity: computeTeamPopularity(true),
    headToHeadLeaderboard: computeHeadToHeadLeaderboard(),
    autoPickRecord: computeAutoPickRecord(),
    teamPerformance: computeTeamPerformance(),
    seasonExtremes: computeSeasonExtremes(),
    streaks: computeStreaks(),
    contrarianCopycat: computeContrarianCopycat(true),
    cardTiming: computeCardTiming(),
    livingDangerously: computeLivesTimeline(),
    formGuide: computeFormGuide(5),
    rivalries: computeRivalries(),
    winner: winner ? {
      name: winner.name, lives: winner.lives,
      wins: winner.wins, draws: winner.draws, losses: winner.losses,
      pickedTeamValue: pickedTeamValue(winner.name).total
    } : null,
    publishedAt: new Date().toISOString()
  };
  await firebase.database().ref(`${PUBLIC_PATH}/seasons/${activeId}`).set(snapshot);
  // bootstrap the public pointer on first-ever publish so existing installs keep
  // working — after this, only createSeason() is allowed to move it deliberately
  const pointerRef = firebase.database().ref(`${PUBLIC_PATH}/activeSeasonId`);
  const pointerSnap = await pointerRef.get();
  if(!pointerSnap.exists()) await pointerRef.set(activeId);
}

  if(!name) return null;
  if(state.teamCrests && state.teamCrests[name]) return state.teamCrests[name];
  for(const n in (state.gameweeks||{})){

const PIE_COLORS = ['#19e2a0','#ffc043','#5b8def','#ff5b7e','#a78bfa','#f97316','#34d399','#fbbf24','#60a5fa','#f472b6','#2dd4bf','#fb7185','#facc15','#818cf8','#4ade80'];
// approximate primary kit colours — several clubs share a colour family (lots of
// reds, a couple of blues), shaded slightly apart where possible; the legend
// labels are what actually disambiguates when two slices land close in hue
const TEAM_COLORS = {
  'Arsenal':'#EF0107', 'Aston Villa':'#670E36', 'Bournemouth':'#B91F24',
  'Brentford':'#E30613', 'Brighton':'#0057B8', 'Burnley':'#6C1D45',
  'Chelsea':'#034694', 'Coventry':'#78D0F2', 'Crystal Palace':'#1B458F',
  'Everton':'#003399', 'Fulham':'#5C5C5C', 'Hull City':'#F18A01',
  'Ipswich':'#1560BD', 'Leeds':'#FFCD00', 'Liverpool':'#C8102E',
  'Man City':'#6CABDD', 'Man Utd':'#DA291C', 'Newcastle':'#9DAFC5',
  'Notts Forest':'#E2231A', 'Spurs':'#132257', 'Sunderland':'#EB172B',
  'West Ham':'#7A263A', 'Wolves':'#FDB913'
};
function teamColor(name, i){ return TEAM_COLORS[name] || PIE_COLORS[i % PIE_COLORS.length]; }
// html2canvas can't rasterize CSS conic-gradient, so draw the pie as real
// pixels on a canvas and embed it as a plain <img> — that snapshots reliably
function darkenHex(hex, factor){
  const c = hex.replace('#','');
  const r = Math.round(parseInt(c.substr(0,2),16) * factor);
  const g = Math.round(parseInt(c.substr(2,2),16) * factor);
  const b = Math.round(parseInt(c.substr(4,2),16) * factor);
  return `rgb(${r},${g},${b})`;
}
// draws a tilted, extruded ("hockey puck") 3D pie: a flattened ellipse on top
// with a darker curved side wall beneath its front half, giving real depth —
// returns {url, width, height} so the caller can size the <img> to match
// loads an image and resolves with it, or null on failure — never rejects,
// so a single broken crest can't derail the whole chart
function loadImageEl(url){
  return new Promise(resolve=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>resolve(img);
    img.onerror = ()=>resolve(null);
    img.src = url;
  });
}
async function drawPieDataUrl(entries, total, size=200){
  const scale = 2;   // sharper on high-DPI phone screens
  const depth = 18;  // wall thickness in CSS pixels
  const rx = size/2 - 2;
  const ry = rx * 0.55;
  const cx = size/2;
  const cy = ry + 2;
  const height = Math.ceil(cy + ry + depth + 3);
  const canvas = document.createElement('canvas');
  canvas.width = size*scale; canvas.height = height*scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // slice boundaries, starting at 12 o'clock (matches the old flat-pie orientation)
  let cum = -Math.PI/2;
  const slices = entries.map((e,i)=>{
    const a0 = cum;
    cum += (e.count/total)*Math.PI*2;
    return {a0, a1:cum, color: teamColor(e.team,i), team: e.team};
  });
  // the wall only needs to show on the bottom half of the ellipse (y > cy) —
  // that's the only side actually facing the viewer in a top-down tilt
  const normalize = a => { let s = a % (2*Math.PI); if(s<0) s += 2*Math.PI; return s; };

  // 1) side wall — only the arc that falls in the front-facing bottom half
  slices.forEach(s=>{
    const wallColor = darkenHex(s.color, 0.92);
    const steps = 36;
    for(let k=0;k<steps;k++){
      const t0 = s.a0 + (s.a1-s.a0)*k/steps;
      const t1 = s.a0 + (s.a1-s.a0)*(k+1)/steps;
      const mid = normalize((t0+t1)/2);
      if(mid <= 0 || mid >= Math.PI) continue;   // top half is hidden from view
      const x0 = cx + rx*Math.cos(t0), y0 = cy + ry*Math.sin(t0);
      const x1 = cx + rx*Math.cos(t1), y1 = cy + ry*Math.sin(t1);
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
      ctx.lineTo(x1, y1+depth); ctx.lineTo(x0, y0+depth);
      ctx.closePath();
      ctx.fillStyle = wallColor;
      ctx.fill();
    }
  });
  // 2) top face — the actual pie, drawn over the walls
  slices.forEach(s=>{
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.ellipse(cx,cy,rx,ry,0,s.a0,s.a1);
    ctx.closePath();
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0,0,0,0.28)';
    ctx.stroke();
  });
  // 3) soft sheen for extra depth
  const sheen = ctx.createRadialGradient(cx-rx*0.3, cy-ry*0.35, 1, cx, cy, rx);
  sheen.addColorStop(0, 'rgba(255,255,255,0.12)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle = sheen;
  ctx.fill();

  // 4) a crest on each wedge wide enough to hold one legibly — thin slivers
  //    (lots of teams splitting the picks evenly) fall back to the legend
  //    below instead, rather than cramming an unreadable badge on
  const MIN_SWEEP = 25 * Math.PI/180;   // ~25° minimum
  const badgeR = 11;                     // badge radius, logical px (pre-scale)
  await Promise.all(slices.map(async s=>{
    const sweep = s.a1 - s.a0;
    if(sweep < MIN_SWEEP) return;
    const mid = s.a0 + sweep/2;
    const px = cx + rx*0.6*Math.cos(mid);
    const py = cy + ry*0.6*Math.sin(mid);
    const crestUrl = findTeamCrest(s.team);
    const img = crestUrl ? await loadImageEl(`${FD_PROXY_URL}?crest=${encodeURIComponent(crestUrl)}`) : null;
    ctx.save();
    ctx.beginPath();
    ctx.arc(px, py, badgeR+2, 0, Math.PI*2);
    ctx.fillStyle = img ? 'rgba(255,255,255,0.92)' : 'rgba(0,0,0,0.38)';
    ctx.fill();
    if(img){
      ctx.clip();
      ctx.drawImage(img, px-badgeR, py-badgeR, badgeR*2, badgeR*2);
    } else {
      ctx.font = '700 10px Barlow, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(teamCode(s.team), px, py+1);
    }
    ctx.restore();
  }));

  return {url: canvas.toDataURL('image/png'), width: size, height};
}

// pulls the live PL table and sets each team's "strength" to its current league position
// (1 = top). Lower summed position among a manager's *remaining* teams then correctly
// means "still has strong teams in reserve" — matching the rulebook tiebreak exactly.
// finds the highest matchday that's entirely finished, probing forward from
// the most recently resolved gameweek — used so "update from live table" uses
// the SAME replay algorithm as every other table computation in the app,
// rather than a separate official-API table that can disagree on tied teams
// (the official table breaks ties with head-to-head record; the replay here
// doesn't replicate that — but having exactly one algorithm everywhere means
// nothing can ever drift out of sync with anything else, which matters more)
async function findLatestFinishedMatchday(){
  const resolvedGws = Object.keys(state.gameweeks||{}).map(Number).filter(n=>state.gameweeks[n].status==='resolved');
  let latestFinished = resolvedGws.length ? Math.max(...resolvedGws) : 0;
  for(let md = latestFinished+1; md <= 38; md++){
    let events;
    try{ ({events} = await tsdbFetchRound(md)); }
    catch(e){ break; }
    if(!events.length) break;
    if(!events.every(e=>e.finished)) break;
    latestFinished = md;
  }
  return latestFinished;
}
async function fetchLiveTable(){
  const latestMd = await findLatestFinishedMatchday();
  if(latestMd < 1){
    state.tableUpdatedAt = new Date().toISOString();
    save();
    return {matched: 0, unmatched: 0, total: 0};
  }
  const matches = await fetchSeasonMatchesUpTo(latestMd);
  const standings = computeStandingsFromMatches(matches, latestMd+1);   // "< latestMd+1" = through latestMd
  let matched = 0;
  if(standings){
    state.teams.forEach(t=>{
      const s = standings.find(x=>x.name===t.name);
      if(s){ t.strength = s.position; matched++; }
    });
  }
  state.tableUpdatedAt = new Date().toISOString();
  save();
  return {matched, unmatched: state.teams.length-matched, total: state.teams.length};
}
// fetches every finished match from matchday 1 through upToMatchday (inclusive),
// reusing the same fixtures/results endpoint used everywhere else — no proxy
// changes needed. Sequential, one call per matchday; fine for a rare admin action.
async function fetchSeasonMatchesUpTo(upToMatchday){
  const allMatches = [];
  for(let md=1; md<=upToMatchday; md++){
    const {events} = await tsdbFetchRound(md);
    events.forEach(e=>{
      if(e.finished && e.homeScore!=null && e.awayScore!=null){
        allMatches.push({home:e.home, away:e.away, homeScore:e.homeScore, awayScore:e.awayScore, matchday:md});
      }
    });
  }
  return allMatches;
}
// standard football table math — 3pts win, 1pt draw, 0pts loss — ranked by
// points, then goal difference, then goals scored. Head-to-head record isn't
// practical to replicate here, so this is a close approximation of the exact
// official tiebreak in the rare case it'd matter, not a perfect reproduction.
function computeStandingsFromMatches(matches, uptoMatchday){
  // strictly BEFORE this gameweek's own matchday — a pick was made before that
  // gameweek's results were known, so its own matches must never count toward
  // the table used to score it
  const relevant = matches.filter(m=>m.matchday<uptoMatchday);
  if(!relevant.length) return null;   // nothing's been played yet (gameweek 1) — no real table exists to score against
  const table = {};
  state.teams.forEach(t=>{ table[t.name] = {name:t.name, points:0, gf:0, ga:0}; });
  relevant.forEach(m=>{
    const h = table[m.home], a = table[m.away];
    if(!h || !a) return;   // team name mismatch — skip rather than crash the whole replay
    h.gf += m.homeScore; h.ga += m.awayScore;
    a.gf += m.awayScore; a.ga += m.homeScore;
    if(m.homeScore > m.awayScore) h.points += 3;
    else if(m.homeScore < m.awayScore) a.points += 3;
    else { h.points += 1; a.points += 1; }
  });
  const ranked = Object.values(table).map(t=>({...t, gd: t.gf - t.ga}))
    .sort((a,b)=> b.points-a.points || b.gd-a.gd || b.gf-a.gf);
  ranked.forEach((t,i)=>{ t.position = i+1; });
  return ranked;
}
// re-scores every already-resolved gameweek's table snapshot using the actual
// table position that gameweek's matchday genuinely held at the time — computed
// by replaying every real result up to that point, not an approximation.
// reconstructs how many times a manager had used each team, counting only
// picks from resolved gameweeks 1 through uptoGw — needed when retroactively
// repairing, since a manager's live .used totals reflect the WHOLE season by
// the time a repair runs, not a specific past point in it
function usedThroughGameweek(name, uptoGw){
  const used = {};
  Object.keys(state.gameweeks||{}).map(Number).filter(n=>n<=uptoGw).sort((a,b)=>a-b).forEach(n=>{
    const g = state.gameweeks[n];
    if(g.status!=='resolved') return;
    const p = g.picks && g.picks[name];
    if(p && p.team) used[p.team] = (used[p.team]||0)+1;
  });
  return used;
}
async function repairHistoricalTableSnapshots(){
  const resolvedGws = Object.keys(state.gameweeks||{}).map(Number)
    .filter(n=>state.gameweeks[n].status==='resolved').sort((a,b)=>a-b);
  if(!resolvedGws.length) return {fixed:0, excluded:0};
  const maxGw = Math.max(...resolvedGws);
  const allMatches = await fetchSeasonMatchesUpTo(maxGw);
  let fixed=0, excluded=0;
  resolvedGws.forEach(n=>{
    const standings = computeStandingsFromMatches(allMatches, n);
    if(!standings){
      delete state.gameweeks[n].tableSnapshot;   // no real table to score against — don't fabricate one
      excluded++;
      return;
    }
    state.gameweeks[n].tableSnapshot = state.teams.map(t=>{
      const s = standings.find(x=>x.name===t.name);
      return {name:t.name, strength: s ? s.position : t.strength};
    });
    fixed++;
    // also backfill Squad Strength as it stood right after this gameweek —
    // includes this gameweek's own result, unlike tableSnapshot above
    const afterStandings = computeStandingsFromMatches(allMatches, n+1);
    if(afterStandings){
      state.gameweeks[n].squadStrengthSnapshot = {};
      state.managers.forEach(m=>{
        const usedMap = usedThroughGameweek(m.name, n);
        state.gameweeks[n].squadStrengthSnapshot[m.name] = state.teams.reduce((s,t)=>{
          const usedCount = usedMap[t.name] || 0;
          if(usedCount >= state.maxPicksPerTeam) return s;
          const left = state.maxPicksPerTeam - usedCount;
          const snap = afterStandings.find(x=>x.name===t.name);
          const pos = snap ? snap.position : 10.5;
          return s + (21-pos)*left;
        }, 0);
      });
    }
  });
  // sync live/global team strength to match the most recent gameweek just
  // repaired, so an open gameweek's live number reflects this repair too,
  // rather than staying stale until someone remembers the separate manual button
  const latestAfter = computeStandingsFromMatches(allMatches, maxGw+1);
  if(latestAfter){
    state.teams.forEach(t=>{
      const snap = latestAfter.find(x=>x.name===t.name);
      if(snap) t.strength = snap.position;
    });
    state.tableUpdatedAt = new Date().toISOString();
  }
  save();
  return {fixed, excluded};
}
// returns {events:[{home,away,homeScore,awayScore,finished}], unmatched:Number} or throws
async function tsdbFetchRound(roundNum){
  const res = await fetch(`${FD_PROXY_URL}?matchday=${roundNum}`);
  if(!res.ok) throw new Error(`Fixture proxy returned ${res.status}`);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  const raw = data && data.matches ? data.matches : [];
  let unmatched = 0;
  const events = raw.map(m=>{
    const home = fdToOurName(m.homeTeam && m.homeTeam.name), away = fdToOurName(m.awayTeam && m.awayTeam.name);
    if(!home || !away){ unmatched++; return null; }
    const ft = m.score && m.score.fullTime;
    const hs = ft ? ft.home : null, as = ft ? ft.away : null;
    const finished = m.status === 'FINISHED' && hs!==null && as!==null;
    return {home, away, homeScore: finished?+hs:null, awayScore: finished?+as:null, finished,
      homeCrest: (m.homeTeam && m.homeTeam.crest) || null,
      awayCrest: (m.awayTeam && m.awayTeam.crest) || null,
      kickoff: m.utcDate || null};
  }).filter(Boolean);
  return {events, unmatched, total: raw.length};
}

      <p class="note">Picks are locked. Step to a later gameweek to enter new picks.</p></div></div>`;
    return;
  }
  // no fixtures yet for this gameweek -> fetch them automatically so auto-pick has
  // something to work from without you having to remember to click the button
  if((!g.fixtures || !g.fixtures.length) && !g._fxAutoTried){
    g._fxAutoTried = true;
    tsdbFetchRound(n).then(({events})=>{
      if(events.length){ g.fixtures = events.map(e=>({home:e.home, away:e.away, homeCrest:e.homeCrest||null, awayCrest:e.awayCrest||null, kickoff:e.kickoff||null})); cacheTeamCrests(events); save(); }

      <select class="fxHome">${`<option value="">home…</option>`+allTeamOpts(f.home)}</select>
      <span class="v">v</span>
      <select class="fxAway">${`<option value="">away…</option>`+allTeamOpts(f.away)}</select>
      <button class="btn ghost fxDel" data-i="${i}" style="padding:7px 11px">×</button>
    </div>`).join('');

  let html = `<details class="fxbox" ${fx.length?'':'open'}><summary>Fixtures · ${fx.length} set
      <span class="note">— only needed to auto-fill a missing pick</span></summary>
    <div style="padding:10px 16px;display:grid;gap:8px">
      <div class="toolbar" style="padding:0 0 4px;border-top:0">
        <button class="btn ghost" id="fetchFix">⇣ Fetch GW${n} fixtures</button>
        ${fx.length?'<button class="btn ghost" id="shareFx">Share fixtures image</button>':''}
        <span class="note" id="fixFetchNote"></span>
      </div>
      ${fxRows}
      <div style="display:flex;gap:8px"><button class="btn ghost" id="addFix">+ Add fixture</button>
        ${fx.length?'<button class="btn ghost" id="clearFix">Clear all</button>':''}</div>
      <p class="note">Order matters: a no-show gets the first away team they haven't already used twice.</p>
    </div></details>`;

  html += renderHeadToHeadPanel(g, previewMaterializedPicks(g));

  html += `<div class="panel"><div class="phead"><h2>Enter picks · GW ${n}</h2>
    <span class="hint">${alive.length} managers in · blanks auto-fill at resolve</span></div>`;
  alive.forEach(m=>{
    const p = (g.picks && g.picks[m.name]) || {};
    const opts = availableTeams(m).sort((a,b)=>a.name.localeCompare(b.name)).map(t=>{
      const rem = state.maxPicksPerTeam - used(m,t.name);
      const sel = (p.team===t.name && !p.auto) ? 'selected':'';
      return `<option value="${t.name}" ${sel}>${t.name} · ${rem} left</option>`;
    }).join('');
    const autoT = (p.auto && p.team) ? p.team : autoPickTeam(m,g);
    const autoLabel = autoT ? `Auto: ${autoT}` : `Auto (add fixtures first)`;
    const auto = !!p.auto ? 'selected':'';
    const noneSel = (p.team===undefined && !p.auto) ? 'selected':'';
    html += `<div class="pickrow" data-m="${m.name}">
      <span class="nm">${m.name}</span>
      <select class="pkTeam">
        <option value="" ${noneSel}>No pick yet${autoT?` — Auto: ${autoT}`:''}</option>
        <option value="__AUTO__" ${auto}>${autoLabel}</option>
        ${opts}
      </select>
      <span class="opts">
        <label class="ck"><input type="checkbox" class="pkWild" ${p.wildcard?'checked':''} ${m.wildcardUsed?'disabled':''}> Wildcard</label>
        <label class="ck"><input type="checkbox" class="pkDraw" ${p.drawcard?'checked':''} ${m.drawcardUsed?'disabled':''}> Drawcard</label>
        <label class="ck"><input type="checkbox" class="pkDoN" ${p.doubleOrNothing?'checked':''} ${m.doubleOrNothingUsed?'disabled':''}> Double or Nothing</label>
      </span>
    </div>`;
  });
  const savedAt = savedAtByGw[n];
  const savedNoteText = savedAt ? `✓ Saved at ${savedAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}` : '';
  const lockNote = g.locked
    ? `<span class="note" style="color:var(--go)">🔒 Picks locked — visible on the player stats page</span>`
    : `<span class="note">🔓 Picks not locked yet — hidden from the player stats page</span>`;
  html += `<div class="toolbar">
      <button class="btn" id="savePicks">Save picks</button>
      <span class="note" id="savedNote" style="color:var(--go)">${savedNoteText}</span>
      <span class="note" id="pickCount"></span>
      <span class="spacer"></span>
      <button class="btn ${g.locked?'ghost':'warn'}" id="toggleLock">${g.locked?'Unlock picks':'Lock picks'}</button>
    </div>
    <div class="toolbar">
      ${lockNote}
      <span class="spacer"></span>
      <button class="btn ghost" id="shareStillToPick">Share still to pick</button>
      <button class="btn ghost" id="sharePieFromPicks">Share picks chart</button>
      <button class="btn ghost" id="goResolve">Go to resolve ›</button>
    </div></div>`;
  view.innerHTML = html;

  // fixtures editing (save immediately so auto previews update)
  function saveFixtures(){
    g.fixtures = [...view.querySelectorAll('.fxpair')].map(r=>({
      home:r.querySelector('.fxHome').value, away:r.querySelector('.fxAway').value
    }));
    readPicksFromForm(); save(); setTab('picks');
  }
  view.querySelectorAll('.fxHome,.fxAway').forEach(s=>s.onchange=saveFixtures);
  view.querySelectorAll('.fxDel').forEach(b=>b.onclick=()=>{ g.fixtures.splice(+b.dataset.i,1); readPicksFromForm(); save(); setTab('picks'); });
  const addFix=document.getElementById('addFix');
  if(addFix) addFix.onclick=()=>{ g.fixtures=(g.fixtures||[]); g.fixtures.push({home:'',away:''}); readPicksFromForm(); save(); setTab('picks'); };
  const clearFix=document.getElementById('clearFix');
  if(clearFix) clearFix.onclick=()=>{ if(confirm('Clear all fixtures for this gameweek?')){ g.fixtures=[]; save(); setTab('picks'); } };
  document.getElementById('fetchFix').onclick = async ()=>{
    const note=document.getElementById('fixFetchNote'); note.textContent='Fetching…';
    try{
      const {events, unmatched, total} = await tsdbFetchRound(n);
      if(!events.length){
        note.textContent = total ? `Found ${total} fixtures but couldn't match any team names.` : 'No fixtures found for that round/season yet.';
        return;
      }
      g.fixtures = events.map(e=>({home:e.home, away:e.away, homeCrest:e.homeCrest||null, awayCrest:e.awayCrest||null, kickoff:e.kickoff||null})); cacheTeamCrests(events);
      readPicksFromForm(); save();
      toast(`Loaded ${events.length} fixtures${unmatched?` (${unmatched} unmatched)`:''}`);
      setTab('picks');
    }catch(e){
      note.textContent = 'Fetch failed: '+e.message;
    }
  };
  const shareFx = document.getElementById('shareFx');
  if(shareFx) shareFx.onclick = ()=>shareFixturesImage(n, fx);

  // only one card can be active per pick — checking any one clears the others
  view.querySelectorAll('.pickrow').forEach(rowEl=>{
    const w = rowEl.querySelector('.pkWild'), d = rowEl.querySelector('.pkDraw'), n2 = rowEl.querySelector('.pkDoN');
    const boxes = [w,d,n2].filter(Boolean);
    boxes.forEach(box=>{
      box.addEventListener('change',()=>{ if(box.checked){ boxes.forEach(other=>{ if(other!==box) other.checked=false; }); } });
    });

  document.getElementById('savePicks').onclick = savePicks;
  document.getElementById('goResolve').onclick = ()=>setTab('resolve');
  document.getElementById('toggleLock').onclick = ()=>{

    const willLock = !g.locked;
    const msg = willLock
      ? `Lock GW${n}'s picks? Once locked, players will be able to see who picked what on the player stats page.`
      : `Unlock GW${n}'s picks? They'll be hidden from the player stats page again until you re-lock or resolve.`;
    if(!confirm(msg)) return;
    g.locked = willLock;
    save();
    toast(willLock ? `GW${n} picks locked` : `GW${n} picks unlocked`);
    autoPublishStats();
  };
  document.getElementById('sharePieFromPicks').onclick = ()=>{
    readPicksFromForm();   // include anything typed but not yet saved
    shareGwPicksPie(n, g);
  };
  document.getElementById('shareStillToPick').onclick = ()=>{
    readPicksFromForm();
    shareStillToPickImage(n, g);
  };
  view.querySelectorAll('.shareH2H').forEach(b=>{
    b.onclick = ()=>{ readPicksFromForm(); shareHeadToHeadImage(n, g); };
  });
  updatePickCount();
}
function readPicksFromForm(){
  const n = gw(); const g = gwObj(n, true); g.picks = g.picks || {};
  view.querySelectorAll('.pickrow').forEach(rowEl=>{
    const name = rowEl.dataset.m;
    const v = rowEl.querySelector('.pkTeam').value;
    const wild = rowEl.querySelector('.pkWild').checked;
    const draw = rowEl.querySelector('.pkDraw').checked;
    const donEl = rowEl.querySelector('.pkDoN');
    const don = donEl ? donEl.checked : false;
    if(v==='') { delete g.picks[name]; return; }
    if(v==='__AUTO__') g.picks[name] = {auto:true, wildcard:wild, drawcard:draw, doubleOrNothing:don};
    else g.picks[name] = {team:v, wildcard:wild, drawcard:draw, doubleOrNothing:don};
  });
}
function updatePickCount(){
  const g = gwObj(gw(), true); const got = Object.keys(g.picks||{}).length;
  const el = document.getElementById('pickCount');
  if(el) el.textContent = `${got}/${aliveManagers().length} entered`;
}
function savePicks(){
  readPicksFromForm();
  const n = gw();
  const ok = save();   // save() re-renders the tab, which rebuilds #savedNote from savedAtByGw
  const now = new Date();
  if(ok){
    savedAtByGw[n] = now;
    toast('Picks saved');
  } else {
    delete savedAtByGw[n];
    toast('Save failed — check your connection and try again');
  }
  updatePickCount();
  // belt-and-braces: write the note directly too, so it shows even if the
  // render pass somehow didn't pick up the fresh savedAtByGw entry
  const el = document.getElementById('savedNote');
  if(el){
    el.style.color = ok ? 'var(--go)' : 'var(--danger)';
    el.textContent = ok
      ? `✓ Saved at ${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`
      : '✗ Save failed';
  }
}

/* --- Resolve --- */
function renderResolve(){
  const n = gw(); const g = gwObj(n, true);
  if(g.status==='resolved'){
    const editRows = state.managers.map(m=>{
      const p = (g.picks && g.picks[m.name]) || {};
      const currentTeam = p.team || '';
      const currentResult = currentTeam ? (g.results && g.results[currentTeam]) : null;
      const teamOpts = [...state.teams].sort((a,b)=>a.name.localeCompare(b.name)).map(t=>
        `<option value="${t.name}" ${t.name===currentTeam?'selected':''}>${t.name}</option>`).join('');
      // wildcard/drawcard/DoN checkboxes: allow keeping what's already flagged on THIS pick even
      // if the card shows used elsewhere — since editing might mean toggling this exact usage off
      const wcDisabled = m.wildcardUsed && !p.wildcard;
      const dcDisabled = m.drawcardUsed && !p.drawcard;
      const donDisabled = m.doubleOrNothingUsed && !p.doubleOrNothing;
      const flags = [p.auto?'auto':'', p.wildcard?'WC':'', p.drawcard?'DC':'', p.doubleOrNothing?'DoN':''].filter(Boolean).join(' · ');
      return `<div class="editrow" data-m="${m.name}">

        <span class="seg edSeg">
          <button class="edR ${currentResult==='W'?'on H':''}" data-r="W">Win</button>
          <button class="edR ${currentResult==='D'?'on D':''}" data-r="D">Draw</button>
          <button class="edR ${currentResult==='L'?'on A':''}" data-r="L">Loss</button>
        </span>
        <label class="ck"><input type="checkbox" class="edWild" ${p.wildcard?'checked':''} ${wcDisabled?'disabled':''}> WC</label>
        <label class="ck"><input type="checkbox" class="edDraw" ${p.drawcard?'checked':''} ${dcDisabled?'disabled':''}> DC</label>
        <label class="ck"><input type="checkbox" class="edDoN" ${p.doubleOrNothing?'checked':''} ${donDisabled?'disabled':''}> DoN</label>
        <button class="btn ghost edSave" style="padding:6px 12px">Save</button>
        <button class="btn ghost edCancel" style="padding:6px 12px">Cancel</button>
      </div>`;
    }).join('');
    view.innerHTML = `<div class="panel"><div class="phead"><h2>Resolve · GW ${n}</h2></div>
      <div class="okbox" style="margin:16px">Gameweek ${n} has been resolved and applied to the table.</div>
      <div class="toolbar"><button class="btn warn" id="undo">Undo this gameweek</button>
      <button class="btn ghost" id="sharePie">Share picks chart</button>
      <span class="note">"Undo" reverses everyone's GW${n} changes and reopens it. Use "Edit a pick or result" below to fix just one manager without touching the rest.</span></div></div>
    ${renderHeadToHeadPanel(g)}
    <div class="panel"><div class="phead"><h2>Edit a pick or result</h2>
      <span class="hint">Change one manager's team, result, or cards — recalculates just that pick</span></div>
      <div style="padding:6px 16px 14px">${editRows}</div></div>`;
    document.getElementById('undo').onclick = ()=>undoGameweek(n);
    document.getElementById('sharePie').onclick = ()=>shareGwPicksPie(n, g);
    view.querySelectorAll('.shareH2H').forEach(b=>{ b.onclick = ()=>shareHeadToHeadImage(n, g); });
    view.querySelectorAll('.editrow .edSeg button').forEach(b=>{
      b.onclick = ()=>{
        const seg = b.closest('.edSeg');
        seg.querySelectorAll('button').forEach(x=>x.classList.remove('on','H','D','A'));
        b.classList.add('on', b.dataset.r==='W'?'H':b.dataset.r==='D'?'D':'A');
      };
    });
    view.querySelectorAll('.editrow .edSave').forEach(b=>{
      b.onclick = ()=>{
        const row = b.closest('.editrow');
        const managerName = row.dataset.m;
        const newTeam = row.querySelector('.edTeam').value;
        const activeR = row.querySelector('.edSeg button.on');
        const newResult = activeR ? activeR.dataset.r : null;
        const newWildcard = row.querySelector('.edWild').checked;
        const newDrawcard = row.querySelector('.edDraw').checked;
        const newDoN = row.querySelector('.edDoN').checked;
        if(!newResult){ toast('Pick Win, Draw or Loss for this manager\u2019s team first'); return; }
        if([newWildcard, newDrawcard, newDoN].filter(Boolean).length > 1){ toast('Only one card can be played on the same pick'); return; }
        if(!confirm(`Update ${managerName}'s GW${n} pick to ${newTeam} (${newResult})${newWildcard?' + Wildcard':''}${newDrawcard?' + Drawcard':''}${newDoN?' + Double or Nothing':''}?`)) return;
        editManagerPick(n, managerName, newTeam, newResult, newWildcard, newDrawcard, newDoN);
      };
    });
    view.querySelectorAll('.editrow .edCancel').forEach(b=>{
      b.onclick = ()=>{
        // discard any unsaved clicks in this row — redraw straight from what's actually saved
        setTab('resolve');
      };
    });
    return;
  }
  // safety net: if you've jumped here without visiting Picks, make sure fixtures exist first
  if((!g.fixtures || !g.fixtures.length) && !g._fxAutoTried){
    g._fxAutoTried = true;
    tsdbFetchRound(n).then(({events})=>{
      if(events.length){ g.fixtures = events.map(e=>({home:e.home, away:e.away, homeCrest:e.homeCrest||null, awayCrest:e.awayCrest||null, kickoff:e.kickoff||null})); cacheTeamCrests(events); save(); }
    }).catch(()=>{});
  }
  // preview who'll be auto-assigned, without actually committing anything —
  // that only happens for real once "Apply" is clicked
  const previewPicks = previewMaterializedPicks(g);
  const picked = new Set();
  Object.values(previewPicks).forEach(p=>{ if(p.team) picked.add(p.team); });
  const teamsToRate = state.teams.filter(t=>picked.has(t.name))
      .sort((a,b)=>b.strength-a.strength);

  let html = `<div class="panel"><div class="phead"><h2>Resolve · GW ${n}</h2>
    <span class="hint">Set how each picked team got on, then apply</span></div>
    <div class="toolbar" style="border-top:0">
      <button class="btn ghost" id="fetchRes">⇣ Fetch GW${n} results</button>
      <button class="btn ghost" id="sharePieOpen">Share picks chart</button>

    </div>`;

  if(teamsToRate.length===0){
